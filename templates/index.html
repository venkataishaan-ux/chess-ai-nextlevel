<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Coach AI • V3.0</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3.0.0">
</head>
<body>
<div class="app">
  <header class="header">
    <div><div class="eyebrow">Chess Coach AI</div><h1>Analyze. Understand. Improve. ♟️</h1><p class="subtitle">V3.0 • Full move classification + blunder breakdown</p></div>
    <div id="engineStatus" class="engine">Checking Stockfish…</div>
  </header>
  <main class="layout">
    <section>
      <div class="card">
        <div class="card-head"><h2>Board Replay</h2><span class="move-counter">V3.0</span></div>
        <div class="board-wrap"><div id="board" class="board" aria-label="Chess board"></div></div>
        <div class="controls">
          <button id="firstBtn" class="nav" type="button" aria-label="First move">⏮</button>
          <button id="prevBtn" class="nav" type="button" aria-label="Previous move">◀</button>
          <div class="move-info"><strong id="moveLabel">Start</strong><span id="moveCounter" class="move-counter">0 / 0</span></div>
          <button id="nextBtn" class="nav" type="button" aria-label="Next move">▶</button>
          <button id="lastBtn" class="nav" type="button" aria-label="Last move">⏭</button>
        </div>
      </div>
      <div class="card" style="margin-top:18px">
        <div class="card-head"><h2>Move List</h2></div><div id="moves" class="moves"><div class="empty">No moves loaded.</div></div>
      </div>
    </section>
    <section>
      <div class="card panel">
        <div class="card-head" style="padding:0 0 10px"><h2>Game Input</h2></div>
        <textarea id="pgn" placeholder="Paste a PGN here…">[Event "V3.0 Test"]
[White "White"]
[Black "Black"]

1. e4 e5 2. Nf3 Nc6 3. Bc4 Nf6 4. d3 Bc5 5. O-O O-O
6. Nc3 d6 7. Bg5 h6 8. Bh4 g5 9. Nxg5</textarea>
        <div class="actions"><button id="loadBtn" class="secondary" type="button">Load Game</button><button id="analyzeBtn" class="primary" type="button">Analyze with Stockfish</button></div>
        <div class="options"><label for="depth">Depth</label><select id="depth"><option value="10">10 • Fast</option><option value="12" selected>12 • Balanced</option><option value="14">14 • Deeper</option><option value="16">16 • Deep</option></select></div>
        <div id="status" class="status">Ready.</div>
      </div>
      <div class="card" style="margin-top:18px"><div class="card-head"><h2>Coach Report</h2></div><div id="analysis" class="report"><div class="empty">Run Stockfish analysis to generate the V3.0 report.</div></div></div>
    </section>
  </main>
</div>
<script src="{{ url_for('static', filename='app.js') }}?v=3.0.0"></script>
</body>
</html>
